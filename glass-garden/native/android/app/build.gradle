plugins { id 'com.android.application' }
def qaServices = providers.gradleProperty('gardenQaServices').orElse('false').get()
if (!(qaServices in ['true','false'])) throw new GradleException('gardenQaServices must be true or false')
android {
 namespace 'dev.pourlune.glassgarden.localqa'
 compileSdk 36
 defaultConfig { applicationId 'dev.pourlune.glassgarden.localqa'; minSdk 26; targetSdk 36; versionCode 6; versionName '0.1.0'; buildConfigField 'boolean','ENABLE_QA_SERVICES',qaServices }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
}
dependencyLocking { lockAllConfigurations() }
dependencies { implementation 'androidx.webkit:webkit:1.15.0'; implementation 'com.google.android.gms:play-services-ads:25.5.0'; implementation 'com.google.android.ump:user-messaging-platform:4.0.0' }

tasks.named('preBuild') { doFirst { def stage = new groovy.json.JsonSlurper().parse(rootProject.file('../../build/native/staged-web.json')); if (stage.nativeBridgeVersion != 3 || !file('src/main/assets/web/media/dream-culture.mp3').isFile()) throw new GradleException('Stage the matching migration/native-effects web bridge first'); if (qaServices == 'true' && (stage.ads != 'official_test' || !file('src/main/assets/web/sdk/gamemunchies/src/index.js').isFile())) throw new GradleException('Stage a verified SDK/test-ad candidate with the connected ad notice first') } }
