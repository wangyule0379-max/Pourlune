<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../build/s4g-release-config-selftest-2/web/"><title>Native target smoke QA</title><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="styles.css"></head><body>
<aside id="qa-tools" style="position:fixed;top:0;left:0;z-index:100;background:white;font:12px sans-serif"><strong>MOCK NATIVE TARGET · ALL SERVICE HTTP INTERCEPTED</strong> <a href="/qa/release-smoke.html?case=qa">QA identity</a> <a href="/qa/release-smoke.html?case=wrong">Wrong production identity</a><output id="fault-status"></output><button onclick="document.getElementById('qa-tools').hidden=true">Hide tools</button></aside>
<main id="phone" aria-label="Pourlune"><div id="screen">Opening isolated storage…</div><section id="game-view" class="inactive"><iframe id="game-frame" title="Puzzle canvas" allow="autoplay"></iframe><div id="hint-banner" hidden role="status"></div></section><div id="overlay" hidden><section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></section></div><div id="save-banner" hidden role="alert"></div><div id="toast" hidden role="status"></div></main>
<script>
const mode=new URLSearchParams(location.search).get('case')||'qa';if(!['qa','wrong'].includes(mode))throw Error('Unknown QA case');
const rawOpen=indexedDB.open.bind(indexedDB),rawFetch=fetch.bind(window);indexedDB.open=(name,version)=>rawOpen('pourlune.qa.release-target.v1.'+mode+'.'+name,version);
let qa=0,production=0,posts=0;function status(){document.getElementById('fault-status').textContent=' · '+mode+' · intercepted QA '+qa+' / production '+production+' / POST '+posts;}
window.fetch=async(input,init={})=>{const url=new URL(typeof input==='string'?input:input.url,location.href);if(url.origin==='https://api.gamemunchies.com'){if(url.href.includes('8feaf0dc-ec12-4308-ac58-16b2180f2d63'))production++;else qa++;if((init.method||'GET')!=='GET')posts++;status();return new Response('',{status:503});}return rawFetch(input,init);};
function emit(type,fields={}){window.GardenAdEvents?.receive({id:crypto.randomUUID(),type,attemptId:'',occurredAt:new Date().toISOString(),...fields});}
window.GardenNativeActive=true;window.GardenNative=Object.freeze({platform:'ios',services:mode==='wrong'?'production':'test',identity:'dev.pourlune.glassgarden.localqa',ads:'test',legacy:true,effects:false,appVersion:'0.1.0+7',send:m=>{if(m.command==='legacy-read')setTimeout(()=>window.GardenLegacy?.receive({protocolVersion:1,status:'missing',sourceFile:'pourlune_dev.sqlite',originalRetained:true}),0);if(m.command==='initialize')setTimeout(()=>emit('consent',{canRequestAds:false,privacyRequired:false}),0);if(m.command==='state')setTimeout(()=>emit('state',{busyAttemptIds:[]}),0);}});status();
</script><script src="game/src/campaign.js"></script><script src="game/src/rules.js"></script><script src="game/src/progress.js"></script><script type="module" src="product.mjs"></script></body></html>
