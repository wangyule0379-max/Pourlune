<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../build/s4h-cancelled-ad-selftest-1/web/"><title>Cancelled native load QA</title><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="styles.css"></head><body>
<aside id="qa-tools" style="position:fixed;top:0;left:0;z-index:100;background:white;font:12px sans-serif"><strong>SIMULATED LOAD FAILURE · NO GOOGLE / SERVER EVENTS</strong><button id="late-failure">Deliver cancelled load failure</button><output id="fault-status"></output><button onclick="document.getElementById('qa-tools').hidden=true">Hide tools</button></aside>
<main id="phone" aria-label="Pourlune"><div id="screen">Opening isolated storage…</div><section id="game-view" class="inactive"><iframe id="game-frame" title="Puzzle canvas" allow="autoplay"></iframe><div id="hint-banner" hidden role="status"></div></section><div id="overlay" hidden><section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></section></div><div id="save-banner" hidden role="alert"></div><div id="toast" hidden role="status"></div></main>
<script src="game/src/campaign.js"></script><script src="game/src/rules.js"></script><script src="game/src/progress.js"></script>
<script type="module">
const rawOpen=indexedDB.open.bind(indexedDB),rawFetch=fetch.bind(window);indexedDB.open=(name,version)=>rawOpen('pourlune.qa.cancelled-ad.v1.'+name,version);
const config=await(await rawFetch('/test-sdk/fixtures/public-qa-config-v4.json')).text();let held=null,loads=0,shows=0,failures=0,posts=0;const observed=new Map();
function status(){document.getElementById('fault-status').textContent=' loads '+loads+' / shows '+shows+' / delivered failures '+failures+' / intercepted POST '+posts;}
window.fetch=async(input,init={})=>{const url=new URL(typeof input==='string'?input:input.url,location.href);if(url.origin==='https://api.gamemunchies.com'){if((init.method||'GET')!=='GET'){posts++;status();return new Response('',{status:503});}return new Response(config,{status:200});}return rawFetch(input,init);};
function emit(type,id='',fields={}){let event=observed.get(type+':'+id);if(!event){event={id:crypto.randomUUID(),type,attemptId:id,occurredAt:new Date().toISOString(),...fields};observed.set(type+':'+id,event);}window.GardenAdEvents?.receive(event);status();}
window.GardenNativeActive=true;window.GardenNative=Object.freeze({platform:'ios',services:'test',identity:'dev.pourlune.glassgarden.localqa',ads:'test',legacy:true,effects:false,appVersion:'0.1.0+7',send:m=>{if(m.command==='legacy-read')setTimeout(()=>window.GardenLegacy?.receive({protocolVersion:1,status:'missing',sourceFile:'pourlune_dev.sqlite',originalRetained:true}),0);if(m.command==='initialize')setTimeout(()=>emit('consent','',{canRequestAds:true,privacyRequired:false}),0);if(m.command==='state')setTimeout(()=>emit('state','',{busyAttemptIds:[]}),0);if(m.command==='load'){held=m.attemptId;loads++;setTimeout(()=>emit('load_requested',held),0);}if(m.command==='cancel')setTimeout(()=>emit('cancelled',m.attemptId),0);if(m.command==='show')shows++;status();}});
document.getElementById('late-failure').onclick=()=>{if(held){failures++;emit('load_failed',held,{reason:'network'});}};status();await import('./product.mjs');
</script></body></html>
