<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../build/s4h-cancelled-ad-selftest-2/web/"><title>Late reward during a second load QA</title><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="styles.css"></head><body>
<aside id="qa-tools" style="position:fixed;top:0;left:0;z-index:100;background:#fff;padding:4px;font:12px sans-serif"><strong>SIMULATED ADS AND CLOCK · NO GMA / NO SERVER EVENTS</strong><button id="close-ad">Close current without reward</button><button id="advance-clock">Advance SIMULATED clock181s</button><button id="deliver-loaded">Deliver second loaded</button><button id="late-reward">Deliver old reward</button><button id="repeat-reward">Repeat same reward</button><button onclick="document.getElementById('qa-tools').hidden=true">Hide tools</button><output id="fault-status"></output></aside>
<main id="phone" aria-label="Pourlune"><div id="screen">Opening isolated storage…</div><section id="game-view" class="inactive"><iframe id="game-frame" title="Puzzle canvas" allow="autoplay"></iframe><div id="hint-banner" hidden role="status"></div></section><div id="overlay" hidden><section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></section></div><div id="save-banner" hidden role="alert"></div><div id="toast" hidden role="status"></div></main>
<script>
const nativeOpen=indexedDB.open.bind(indexedDB),originalFetch=window.fetch.bind(window);
indexedDB.open=(name,version)=>nativeOpen('pourlune.qa.reward-during-load.v1.'+name,version);
window.GardenNativeActive=true;
const realNow=performance.now.bind(performance);let elapsed=0;Object.defineProperty(performance,'now',{value:()=>realNow()+elapsed});
let showing=null,closed=null,held=null,loads=0,shows=0,posts=0,music=false;
const observed=new Map(),status=()=>document.getElementById('fault-status').textContent='loads '+loads+' / shows '+shows+' / simulated clock '+elapsed+'ms / POST '+posts;
const fixture={"gameId":"566121d2-a3f5-4950-8bd9-6ff2f673a0ac","platform":"ios","version":4,"publishedAt":"2026-10-28T06:12:27.441Z","config":{"enabled":true,"interstitial":{"enabled":true,"scenes":{"next_level":true},"minIntervalSeconds":180},"rewarded":{"scenes":{"extra_bottle":true}}},"configSchema":2};
window.fetch=async(input,init={})=>{const url=new URL(typeof input==='string'?input:input.url,location.href);if(url.origin==='https://api.gamemunchies.com'){if((init.method||'GET')==='GET')return new Response(JSON.stringify(fixture),{status:200});posts++;status();return new Response('',{status:503});}return originalFetch(input,init);};
function emit(type,attemptId,fields={}){const key=type+':'+attemptId;let event=observed.get(key);if(!event){event={id:crypto.randomUUID(),type,attemptId,occurredAt:new Date().toISOString(),...fields};observed.set(key,event);}window.GardenAdEvents?.receive(event);status();}
window.GardenNative=Object.freeze({platform:'ios',services:'test',ads:'test',legacy:true,effects:true,identity:'dev.pourlune.glassgarden.localqa',appVersion:'0.1.0+7',send:message=>{
 if(message.command==='legacy-read')setTimeout(()=>window.GardenLegacy?.receive({protocolVersion:1,status:'missing',sourceFile:'pourlune_dev.sqlite',originalRetained:true}),0);
 if(message.command==='initialize')setTimeout(()=>emit('consent','',{canRequestAds:true,privacyRequired:false}),0);
 if(message.command==='state')setTimeout(()=>emit('state','',{busyAttemptIds:showing?[showing]:[]}),0);
 if(message.command==='load'){held=message.attemptId;loads++;setTimeout(()=>emit('load_requested',held),0);if(loads===1)setTimeout(()=>emit('loaded',held),50);}
 if(message.command==='show'){shows++;showing=message.attemptId;setTimeout(()=>emit('shown',showing),0);}
 if(message.command==='cancel')emit('cancelled',message.attemptId);
 if(message.command==='music')music=message.enabled;
 if(message.command==='copy-email')window.GardenExternal?.result('copy',false);
 status();
}});
document.getElementById('close-ad').onclick=()=>{if(showing){closed=showing;showing=null;emit('closed',closed);}};
document.getElementById('advance-clock').onclick=()=>{elapsed+=181000;status();};
document.getElementById('deliver-loaded').onclick=()=>{if(held)emit('loaded',held);};
document.getElementById('late-reward').onclick=()=>{if(closed)emit('reward',closed);};
document.getElementById('repeat-reward').onclick=()=>{if(closed)emit('reward',closed);};
status();
</script><script src="game/src/campaign.js"></script><script src="game/src/rules.js"></script><script src="game/src/progress.js"></script><script type="module" src="product.mjs"></script></body></html>
