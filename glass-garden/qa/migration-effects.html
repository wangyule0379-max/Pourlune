<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../build/s4d-migration-effects-selftest-2/web/"><title>Controlled migration and native-effects QA</title><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="styles.css"></head><body>
<aside id="qa-tools" style="position:fixed;top:0;left:0;z-index:100;background:#fff;padding:4px;font:12px sans-serif"><strong>CONTROLLED NATIVE PORTS — NOT HARDWARE</strong><a href="/qa/migration-effects.html">Old settings</a> <a href="/qa/migration-effects.html?case=missing">Missing</a> <a href="/qa/migration-effects.html?case=error">Read error</a><button onclick="window.GardenLifecycle?.audioInterrupted(true)">Audio interrupt</button><button onclick="window.GardenLifecycle?.audioInterrupted(false)">Audio resume</button><button onclick="document.getElementById('qa-tools').hidden=true">Hide tools</button><output id="fault-status"></output></aside>
<main id="phone" aria-label="Pourlune"><div id="screen">Opening isolated storage…</div><section id="game-view" class="inactive"><iframe id="game-frame" title="Puzzle canvas" allow="autoplay"></iframe><div id="hint-banner" hidden role="status"></div></section><div id="overlay" hidden><section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></section></div><div id="save-banner" hidden role="alert"></div><div id="toast" hidden role="status"></div></main>
<script>
const which=new URLSearchParams(location.search).get('case')||'present',nativeOpen=indexedDB.open.bind(indexedDB);
indexedDB.open=(_name,version)=>nativeOpen('pourlune.glass-garden.qa.s4d.'+which+'.v1',version);
window.GardenNativeActive=true;
let reads=0,haptics=0,music=false;
const status=()=>document.getElementById('fault-status').textContent='Legacy reads this load: '+reads+' · music request: '+music+' · haptic requests: '+haptics;
window.GardenNative=Object.freeze({platform:'ios',services:'disabled',ads:'disabled',legacy:true,effects:true,appVersion:'0.1.0+4',send:message=>{
 if(message.command==='legacy-read'){reads++;setTimeout(()=>window.GardenLegacy?.receive(which==='missing'?{protocolVersion:1,status:'missing',sourceFile:'pourlune_dev.sqlite',originalRetained:true}:which==='error'?{protocolVersion:1,status:'error',sourceFile:'pourlune_dev.sqlite',originalRetained:true}:{protocolVersion:1,status:'present',sourceFile:'pourlune_dev.sqlite',originalRetained:true,databaseVersion:5,preferences:{music:true,sound:false,haptics:true,reduced_motion:true,color_symbols:false,strong_contrast:true},privacy:{analytics:false,crash:true}}),0);}
 if(message.command==='music')music=message.enabled;
 if(message.command==='haptic')haptics++;
 if(message.command==='copy-email')window.GardenExternal?.result('copy',false);
 status();
}});
status();
</script><script src="game/src/campaign.js"></script><script src="game/src/rules.js"></script><script src="game/src/progress.js"></script><script type="module" src="product.mjs"></script></body></html>
