<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../build/s4c-reward-selftest-1/web/"><title>Controlled extra-bottle QA</title><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="styles.css"></head><body>
<aside id="qa-tools" style="position:fixed;top:0;left:0;z-index:100;background:#fff;padding:4px;font:12px sans-serif"><strong>CONTROLLED RECEIPTS — NOT ADMOB</strong><button data-checkpoint="1">Extra1</button><button data-checkpoint="16">Extra16</button><button data-checkpoint="39">Extra39</button><button data-checkpoint="61">Extra61</button><button data-checkpoint="100">Extra100</button><button onclick="document.getElementById('qa-tools').hidden=true">Hide tools</button><output id="fault-status">Own QA save only</output></aside>
<main id="phone" aria-label="Pourlune"><div id="screen">Opening isolated storage…</div><section id="game-view" class="inactive"><iframe id="game-frame" title="Puzzle canvas" allow="autoplay"></iframe><div id="hint-banner" hidden role="status"></div></section><div id="overlay" hidden><section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></section></div><div id="save-banner" hidden role="alert"></div><div id="toast" hidden role="status"></div></main>
<script>
// Separate HTTP origin AND forced QA namespace. This file is never packaged.
const nativeOpen=indexedDB.open.bind(indexedDB);
indexedDB.open=(_name,version)=>nativeOpen('pourlune.glass-garden.qa.s4-reward.v1',version);
for(const button of document.querySelectorAll('[data-checkpoint]'))button.onclick=async()=>{
 const n=Number(button.dataset.checkpoint),r=await fetch('/build/qa-reward/checkpoint-'+n+'.json');if(!r.ok)return;
 const data=await r.json(),q=indexedDB.open('ignored',1);q.onsuccess=()=>{const db=q.result,tx=db.transaction('snapshots','readwrite'),store=tx.objectStore('snapshots'),get=store.get('current');get.onsuccess=()=>{if(get.result)store.put(get.result,'qa-before-checkpoint');store.put({revision:(get.result?.revision||0)+1,data},'current');};tx.oncomplete=()=>{db.close();location.reload();};tx.onabort=()=>document.getElementById('fault-status').textContent='QA checkpoint import failed';};
};
</script><script src="game/src/campaign.js"></script><script src="game/src/rules.js"></script><script src="game/src/progress.js"></script><script type="module" src="product.mjs"></script></body></html>
